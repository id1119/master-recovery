name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job scopes its own elevated permissions below; the workflow-level
# default is read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tar.gz
    # upload-artifact writes to the run's artifact store under `actions`.
    # The build must be a cold rebuild for the repro job to be meaningful,
    # so no actions/cache is used here (also removes the cache-poisoning
    # surface on the artifact-publishing path).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit mode: logs egress for review, never blocks builds.
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0 (branch)
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }} --locked

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="dist/${{ matrix.target }}"
          mkdir -p "$BIN_DIR"
          for bin in gp-cli gp-network; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.artifact == 'zip' && '.exe' || '' }}" "$BIN_DIR/"
          done
          cd "$BIN_DIR"
          if [ "${{ matrix.artifact }}" = "zip" ]; then
            7z a "../${{ matrix.target }}.zip" . >/dev/null
          else
            tar -czf "../${{ matrix.target }}.tar.gz" .
          fi
          cd ..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.target }}.${{ matrix.artifact }}" > "SHA256SUMS-${{ matrix.target }}"
          else
            shasum -a 256 "${{ matrix.target }}.${{ matrix.artifact }}" > "SHA256SUMS-${{ matrix.target }}"
          fi
          ls -la

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}.${{ matrix.artifact }}
            dist/SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error

  # Verifies the published x86_64-unknown-linux-gnu binaries can be reproduced
  # from source on a fresh checkout with the same pinned toolchain. The release
  # archives embed file mtimes, so we compare the unpacked binaries rather than
  # the tar.gz/zip hashes; the archive itself is only verified against the
  # published SHA256SUMS for integrity.
  repro:
    name: Repro check (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0 (branch)
        with:
          targets: x86_64-unknown-linux-gnu
      # Mirrors the build job's command for the linux amd64 target, plus
      # --locked; the build job uses no RUSTFLAGS.
      - name: Rebuild release binaries
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-unknown-linux-gnu
          path: published
      - name: Verify published archive checksum
        run: |
          set -euo pipefail
          cd published
          sha256sum -c SHA256SUMS-x86_64-unknown-linux-gnu
      - name: Compare rebuilt binaries against published
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf published/x86_64-unknown-linux-gnu.tar.gz -C extracted
          for bin in gp-cli gp-network; do
            rebuilt="target/x86_64-unknown-linux-gnu/release/$bin"
            published_bin="extracted/$bin"
            [ -f "$published_bin" ] || { echo "::error::$bin missing from published archive"; exit 1; }
            a=$(sha256sum "$rebuilt" | cut -d' ' -f1)
            b=$(sha256sum "$published_bin" | cut -d' ' -f1)
            echo "$bin: rebuilt=$a published=$b"
            [ "$a" = "$b" ] || { echo "::error::$bin is not reproducible"; exit 1; }
          done

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    # ghcr.io push needs `packages: write`; nothing else is elevated here.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-network
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The gha cache is scoped to the ref so PR runs can never feed cache
      # into a tag-triggered release build (cache-poisoning resistance).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.network
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref }}
          cache-to: type=gha,mode=max,scope=${{ github.ref }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-network:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, docker]
    # download-artifact reads the run's artifact store under `actions`;
    # gh release create needs `contents: write` for the release asset.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/sbom.spdx.json \
            --generate-notes \
            --title "Master Recovery $GITHUB_REF_NAME"
