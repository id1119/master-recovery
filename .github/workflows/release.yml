name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="dist/${{ matrix.target }}"
          mkdir -p "$BIN_DIR"
          for bin in gp-cli gp-network; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.artifact == 'zip' && '.exe' || '' }}" "$BIN_DIR/"
          done
          cd "$BIN_DIR"
          if [ "${{ matrix.artifact }}" = "zip" ]; then
            7z a "../${{ matrix.target }}.zip" . >/dev/null
          else
            tar -czf "../${{ matrix.target }}.tar.gz" .
          fi
          cd ..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.target }}.${{ matrix.artifact }}" > "SHA256SUMS-${{ matrix.target }}"
          else
            shasum -a 256 "${{ matrix.target }}.${{ matrix.artifact }}" > "SHA256SUMS-${{ matrix.target }}"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}.${{ matrix.artifact }}
            dist/SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-network
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.network
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-network:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/sbom.spdx.json \
            --generate-notes \
            --title "Master Recovery $GITHUB_REF_NAME"