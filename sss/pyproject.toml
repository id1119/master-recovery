[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shamir"
version = "0.1.0"
description = "Merged Shamir secret sharing package: VSS, PVSS, DKG, robust, proactive, hybrid, weighted, hierarchical, multisecret, reshare"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["shamir"]
