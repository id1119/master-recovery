[workspace]
resolver = "2"
members = [
    "crates/gp-types",
    "crates/gp-crypto",
    "crates/gp-wire",
    "crates/gp-core",
    "crates/gp-storage",
    "crates/gp-transport",
    "crates/gp-sim",
    "crates/gp-ipc",
    "crates/gp-gui-sim",
    "crates/gp-cli",
]
default-members = ["crates/gp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
rand_chacha = "0.9"
rand08 = { package = "rand", version = "0.8" }
rand_chacha08 = { package = "rand_chacha", version = "0.3" }
rand_chacha10 = { package = "rand_chacha", version = "0.10" }
reed-solomon-erasure = "6.0"
rs_merkle = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blahaj = "0.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net"] }
x-wing = { version = "0.1", features = ["getrandom", "zeroize", "hazmat"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
